name: MONO quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Dependency security audit
        run: |
          npm audit fix || true
          npm audit --json > audit-report.json || true
          node --input-type=module -e "import fs from 'node:fs'; const r=JSON.parse(fs.readFileSync('audit-report.json','utf8')); const entries=Object.entries(r.vulnerabilities||{}); const actionable=entries.filter(([name,v])=>v.severity==='critical'||(v.severity==='high'&&v.via.some(item=>typeof item!=='string')&&v.fixAvailable===true)); const unresolved=entries.filter(([name,v])=>v.severity==='high'&&v.fixAvailable!==true); console.log(JSON.stringify({counts:r.metadata?.vulnerabilities, actionable:actionable.map(([name,v])=>({name,severity:v.severity,fixAvailable:v.fixAvailable})), upstreamUnresolved:unresolved.map(([name,v])=>({name,severity:v.severity,fixAvailable:v.fixAvailable}))},null,2)); if(actionable.length) process.exit(1);"
      - name: Unit tests
        run: npm test
      - name: Indicator performance benchmark
        run: npm run benchmark
      - name: Production build
        run: npm run build
